<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>要望メモ ログイン</title>
    <style>
        :root { --accent: #1a3a5c; --bg: #f7f5f0; --border: #d5d0c6; }
        body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; background: var(--bg); margin: 0; color: #333; }
        .wrap { max-width: 420px; margin: 48px auto; padding: 0 16px; }
        h1 { font-size: 1.35rem; color: var(--accent); }
        form { background: #fff; border: 1px solid var(--border); padding: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input[type=password] { width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 14px; border: 1px solid var(--border); }
        button { background: var(--accent); color: #fff; border: 0; padding: 10px 18px; cursor: pointer; }
        .flash { padding: 10px; margin-bottom: 12px; background: #fde8e8; border: 1px solid #e0a0a0; }
        a { color: var(--accent); }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>要望メモ ログイン</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <form method="post" action="{{ url_for('memo_login') }}">
            {{ form.hidden_tag() }}
            <label for="password">パスワード</label>
            {{ form.password(id="password", autocomplete="current-password") }}
            <button type="submit">ログイン</button>
        </form>
        <p style="margin-top:16px;"><a href="{{ url_for('index') }}">← 漢方推奨に戻る</a></p>
    </div>
</body>
</html>
